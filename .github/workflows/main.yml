name: Get Feed

on:
  schedule:
    - cron: '47 * * * *' # 12:30 UTC (20:30 Beijing time)
  workflow_dispatch:

# 需要写权限：把更新后的 data/seen-guids.json 提交回仓库，
# 用于记住所有处理过的条目，防止删除后重复抓取。
permissions:
  contents: write

jobs:
  get-feed:
    runs-on: ubuntu-latest
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_READER_DATABASE_ID: ${{ secrets.NOTION_READER_DATABASE_ID }}
      NOTION_FEEDS_DATABASE_ID: ${{ secrets.NOTION_FEEDS_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build-prod

      - name: Update Notion Feed
        run: node dist/index.js

      - name: Save seen GUIDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen-guids.json
          if git diff --cached --quiet; then
            echo "No changes to seen GUIDs"
          else
            git commit -m "chore: update seen GUIDs"
            git push
          fi
